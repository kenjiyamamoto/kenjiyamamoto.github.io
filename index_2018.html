        <link rel="apple-touch-icon-precomposed" sizes="144x144" href="static/img/apple-touch-icon-144-precomposed.png">
        <link rel="apple-touch-icon-precomposed" sizes="114x114" href="static/img/apple-touch-icon-114-precomposed.png">
        <link rel="apple-touch-icon-precomposed" sizes="72x72" href="static/img/apple-touch-icon-72-precomposed.png">

        <link href="https://fonts.googleapis.com/css?family=Open+Sans:400,600,700" rel="stylesheet">
        <link rel="stylesheet" href="static/css/shared.css">

        <style>
            html {
                background: url("img/bg-rio.jpg") no-repeat center center fixed;
                background-size: cover;
            }
            body {font-family: 'Open Sans', sans-serif;letter-spacing: -1px;}
            h1,h2,h3 {color:#FFF;margin: 0;text-shadow: 1px 1px 2px rgba(0,0,0,0.5);}
            h1 {font-size: 30px;font-weight: 700;font-style: italic;}
            h2 {font-size: 20px;font-weight: 400;}
            h3 {font-size: 50px;font-weight: 700;}
            a {text-decoration: none;}
            main {
                align-items: center;
                display: flex;
                flex-direction: column-reverse;
                height: 200px;
                width: 300px;
            }
            main section {
                border-top: 2px solid #FFF;
                padding: 20px 0 0 0;
                overflow: hidden;
                text-align: center;
                height: 200px;
                width: 300px;
            }
            main section h1 {
                animation: headerMob0 1s ;
                animation-timing-function: ease-out;
            }
            main section h2 {
                animation: headerMob1 1s ;
                animation-timing-function: ease-out;
            }
            @keyframes headerMob0 {
              0% {margin-top: -100px;}
              100% {margin-top: 0;}
            }
            @keyframes headerMob1 {
              0% {margin-top: -10px;}
              100% {margin-top: 0;}
            }

            hr {
                background-color: #FFF;
                border: none;
                height: 2px;
                width: 100%;
            }
            .social {
                position: absolute;
                top: 20px;
                right: 20px;
            }
            .social svg {
                margin: 0 3px;
                width: 30px;
            }
            footer {
                bottom: 0;
                color: #FFF;
                font-size: 10px;
                font-weight: lighter;
                letter-spacing: 1.2px;
                line-height: 1.5em;
                padding: 0 50px 10px 50px;
                position: fixed;
                opacity: 0.5;
                text-align: center;
                width: 200px;
            }
            @media screen and (min-width: 767px) {
                h1 {font-size: 35px;}
                h2 {font-size: 25px;}
                main {
                    flex-direction: row-reverse;
                    width: 600px;
                }
                hr {
                    height: 150px;
                    width: 2px;
                }
                .social {
                    right: 17px;
                    width: auto;
                }

                main section {
                    border-top: none;
                    border-left: 2px solid #FFF;
                    margin-left: 50px;
                    padding: 20px 0 25px 50px;

                    margin-top: 0;
                    height: auto;

                    overflow: hidden;
                    text-align: left;
                    width: 400px;
                }
                main section h1,
                main section h2 {
                    animation: header0 1.5s ;
                    animation-timing-function: ease-out;
                }
                @keyframes header0 {
                  0% {
                    margin-left: -500px;
                  }
                  100% {
                    margin-left: 0;
                  }
                }

                footer {
                    line-height: 2.5em;
                    padding: 0;
                    width: 600px;
                }
            }
        </style>
    </head>
    <body>
        <main>
            <section>
                <h1>i'm kenji yamamoto</h1>
                <h2>software developer & data analyst.</h2>
            </section>

            <h3>hello</h3>
        </main>
        <section class="social" title="Linkedin">
            <a class="linkedin" href="https://www.linkedin.com/in/kenjiyamamoto/">
                <svg viewBox="0 0 24 24" aria-hidden="true"><use href="static/img/icons.svg#linkedin"></use></svg>
            </a>
            <a href="https://github.com/kenjiyamamoto" title="Github">
                <svg viewBox="0 0 24 24" aria-hidden="true"><use href="static/img/icons.svg#github-square"></use></svg>
            </a>
            <a href="https://twitter.com/kenjiyamamoto" title="Twitter">
                <svg viewBox="0 0 24 24" aria-hidden="true"><use href="static/img/icons.svg#twitter-square"></use></svg>
            </a>
        </section>
        <footer>
            Copyright © Kenji Yamamoto, Inc. All rights reserved.
        </footer>
