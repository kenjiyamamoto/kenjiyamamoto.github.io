<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Get Geo Location</title>
    <link rel="stylesheet" href="static/css/shared.css">
    <script src="static/js/site.js" defer></script>
</head>
<body>
    <div>
        <span>Cidade:</span>
        <h1 class="city">Cidade: </h1>

        <span>IP:</span>
        <h1 class="ip">IP: </h1>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const city = document.querySelector(".city");
            const ip = document.querySelector(".ip");

            site.jsonp("http://api.globo.com/geo/", "globoapi_geo_callback").then((res) => {
                if (!res || !res.city) {
                    throw new Error("Unexpected geo response: " + JSON.stringify(res));
                }
                city.innerHTML = res.city.name;
                ip.innerHTML = res.ip;
            }).catch((err) => {
                console.error("Unable to load geo location:", err);
                city.innerHTML = "Cidade: indisponível";
                ip.innerHTML = "IP: indisponível";
            });
        });
    </script>
</body>
</html>
